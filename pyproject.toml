[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l5tk"
version = "2.3.0"
description = "多机型 Android 工具箱：设备画像 / Google Play / boot 刷入"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "l5tk" }]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
l5tk = "l5tk.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["l5tk", "l5tk.core", "l5tk.device", "l5tk.ops", "l5tk.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
